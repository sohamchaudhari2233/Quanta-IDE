name: Quanta IDE Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install and Build PC Extension
        run: |
          cd Quanta-PC-Extension
          npm ci
          npm run compile
          npx @vscode/vsce package --out ../quanta-pc-extension.vsix

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: quanta-pc-extension.vsix
          draft: false
          prerelease: false
          generate_release_notes: true

