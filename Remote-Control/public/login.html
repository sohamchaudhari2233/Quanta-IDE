<!DOCTYPE html>
<html lang="en" data-theme="paper">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#F3EEE3">
    <title>Login — Quanta IDE Remote Control</title>

    <!-- Pre-paint Theme Initializer (Zero-Flash) -->
    <script src="js/theme-init.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,500;0,7..72,600;0,7..72,700;1,7..72,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/workspace.css">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/png" href="/assets/antigravity.png">
    <link rel="apple-touch-icon" href="/assets/antigravity.png">

    <style>
        .login-viewport {
            min-height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: var(--panel-bg);
            backdrop-filter: var(--panel-blur);
            -webkit-backdrop-filter: var(--panel-blur);
            border: 1px solid var(--gold-border);
            border-radius: 14px;
            padding: 36px 30px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4), var(--gold-glow);
            position: relative;
        }

        .login-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .login-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--gold-accent);
            background: rgba(217, 164, 65, 0.08);
            border: 1px solid var(--gold-border);
            padding: 3px 10px;
            border-radius: 20px;
            margin-bottom: 12px;
        }

        .login-title {
            font-size: 26px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 6px;
            letter-spacing: -0.01em;
        }

        .login-desc {
            font-size: 12.5px;
            color: var(--text-2);
            line-height: 1.5;
        }

        .login-input-wrap {
            position: relative;
            margin-bottom: 16px;
        }

        .login-input-label {
            display: block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10.5px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-2);
            margin-bottom: 6px;
        }

        .password-field-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-field-container input {
            width: 100%;
            padding: 10px 42px 10px 14px;
            background: rgba(0, 0, 0, 0.22);
            border: 1px solid var(--gold-border);
            border-radius: 8px;
            color: var(--text);
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .password-field-container input:focus {
            outline: none;
            border-color: var(--gold-accent);
            box-shadow: 0 0 0 2px rgba(217, 164, 65, 0.25);
        }

        .toggle-password-btn {
            position: absolute;
            right: 10px;
            background: transparent;
            border: none;
            color: var(--text-3);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-xs);
        }

        .toggle-password-btn:hover {
            color: var(--gold-accent);
        }

        .toggle-password-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }

        .login-btn-submit {
            width: 100%;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--gold-gradient);
            color: #18120B;
            font-weight: 600;
            font-size: 13.5px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(196, 144, 69, 0.3);
            transition: all 0.2s ease;
        }

        .login-btn-submit:hover {
            background: var(--gold-gradient-hover);
            transform: translateY(-1px);
        }

        .login-error-banner {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            background: var(--signal-subtle);
            border: 1px solid var(--signal);
            border-radius: var(--radius-xs);
            color: var(--signal-text);
            font-size: 12px;
            margin-bottom: 16px;
        }

        .login-hint-block {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--rule);
            font-size: 11px;
            color: var(--text-3);
            text-align: center;
            line-height: 1.5;
        }

        .login-hint-block code {
            font-family: 'JetBrains Mono', monospace;
            background: var(--surface-sunken);
            border: 1px solid var(--rule);
            padding: 1px 4px;
            border-radius: 2px;
            color: var(--text-2);
        }

        .theme-strip {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-top: 16px;
        }
    </style>
</head>

<body class="login-page">
    <div class="login-viewport">
        <main class="login-card" role="main">
            <header class="login-header">
                <div class="empty-state-emblem" style="margin: 0 auto 14px auto;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="var(--gold-accent)" stroke-width="1.8">
                        <polygon points="12 2 22 7 12 12 2 7 12 2" />
                        <polyline points="2 12 12 17 22 12" />
                        <polyline points="2 17 12 22 22 17" />
                    </svg>
                </div>
                <div class="login-badge">
                    <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" fill="none" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    Quanta Remote Control
                </div>
                <h1 class="serif-heading login-title">Quanta IDE Remote</h1>
                <p class="login-desc">Enter your server master password to access your autonomous AI agent workspace.</p>
            </header>

            <form id="loginForm" autocomplete="on">
                <div class="login-input-wrap">
                    <label for="password" class="login-input-label">Master Password</label>
                    <div class="password-field-container">
                        <input type="password" id="password" name="password" placeholder="••••••••••••" autocomplete="current-password" required autofocus>
                        <button type="button" class="toggle-password-btn" id="togglePasswordBtn" aria-label="Show password" title="Toggle password visibility">
                            <svg viewBox="0 0 24 24" id="eyeIcon">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- 2FA TOTP Input Field (F-23) -->
                <div class="login-input-wrap" id="totpGroup" style="display: none;">
                    <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px;">
                        <label for="totp" class="login-input-label" style="margin-bottom: 0;">2FA Authenticator Code</label>
                        <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--gold-accent);">RFC 6238</span>
                    </div>
                    <div class="password-field-container">
                        <input type="text" id="totp" name="totp" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="000000" autocomplete="one-time-code" style="letter-spacing: 0.25em; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 16px;">
                    </div>
                </div>

                <!-- Optional Toggle for Manual 2FA reveal -->
                <div style="text-align: right; margin-top: -8px; margin-bottom: 14px;">
                    <button type="button" id="btnToggleTotp" style="background: none; border: none; color: var(--gold-accent); font-size: 11px; cursor: pointer; padding: 0; text-decoration: underline; opacity: 0.85;">
                        Use 2FA / Authenticator Code
                    </button>
                </div>

                <div class="login-error-banner" id="loginError" role="alert">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                    <span id="loginErrorText">Invalid master password.</span>
                </div>

                <button type="submit" class="login-btn-submit" id="loginBtn">
                    Connect Securely
                </button>
            </form>

            <footer class="login-hint-block">
                <div>Authentication configured via <code>APP_PASSWORD</code> in <code>.env</code></div>
                <div class="theme-strip">
                    <button class="btn btn-secondary" data-theme-select="system" style="padding: 2px 8px; font-size: 10.5px;">System</button>
                    <button class="btn btn-secondary" data-theme-select="paper" style="padding: 2px 8px; font-size: 10.5px;">Paper</button>
                    <button class="btn btn-secondary" data-theme-select="graphite" style="padding: 2px 8px; font-size: 10.5px;">Graphite</button>
                    <button class="btn btn-secondary" data-theme-select="ink" style="padding: 2px 8px; font-size: 10.5px;">Ink</button>
                </div>
            </footer>
        </main>
    </div>

    <script src="js/login.js"></script>
</body>

</html>
